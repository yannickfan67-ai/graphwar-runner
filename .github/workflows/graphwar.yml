name: Graphwar Official Multiplayer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/graphwar.yml"
      - "src/Graphwar/OnlineAgent.java"
      - "src/Graphwar/AutoAgent.java"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: graphwar-official-multiplayer
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 105

    steps:
      - name: Check out runner source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install GUI and recorder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg

      - name: Download original Graphwar 1
        run: |
          curl -fL --retry 3 "https://www.graphwar.com/graphwar_1/graphwar.jar" -o graphwar.jar
          test -s graphwar.jar
          file graphwar.jar

      - name: Build my official multiplayer agent
        run: |
          set -euo pipefail
          mkdir -p classes
          javac -cp graphwar.jar -d classes src/Graphwar/AutoAgent.java src/Graphwar/OnlineAgent.java
          printf 'Premain-Class: Graphwar.OnlineAgent\n' > MANIFEST.MF
          jar cfm online-agent.jar MANIFEST.MF -C classes .
          jar tf online-agent.jar | grep 'Graphwar/OnlineAgent'

      - name: Play official server and record
        shell: bash
        run: |
          set -uo pipefail
          export DISPLAY=:99

          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          XVPID=$!
          sleep 1

          ffmpeg -y \
            -f x11grab -framerate 10 -video_size 1280x800 -i :99 \
            -c:v libx264 -preset veryfast -crf 29 -pix_fmt yuv420p \
            -f segment -segment_time 1800 -reset_timestamps 1 \
            'graphwar-official-%03d.mp4' >ffmpeg.log 2>&1 &
          FFPID=$!

          set +e
          timeout --signal=TERM --kill-after=10s 5700s \
            java -javaagent:online-agent.jar -jar graphwar.jar \
            >agent.log 2>&1
          JAVA_RC=$?
          set -e

          echo "java_exit=$JAVA_RC" | tee run-status.txt
          sleep 2

          ffmpeg -y -f x11grab -video_size 1280x800 -i :99 \
            -frames:v 1 graphwar-final.png >screenshot.log 2>&1 || true

          kill -INT "$FFPID" 2>/dev/null || true
          sleep 3
          kill "$XVPID" 2>/dev/null || true

          echo '===== agent.log tail ====='
          tail -n 500 agent.log || true

      - name: Report result to control issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### [GPT] Official Graphwar multiplayer run'
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 350 agent.log 2>/dev/null || echo 'agent.log unavailable'
            echo '```'
          } > comment.md
          jq -Rs '{body:.}' comment.md | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/1/comments" --input - >/dev/null 2>&1 || true

      - name: Upload recording and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphwar-official-${{ github.run_number }}
          compression-level: 1
          path: |
            graphwar-official-*.mp4
            graphwar-final.png
            agent.log
            run-status.txt
            xvfb.log
            ffmpeg.log
            screenshot.log
          if-no-files-found: warn
