name: Graphwar Official Autoplay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/graphwar.yml"
      - "src/Graphwar/*.java"
  workflow_dispatch:
    inputs:
      chain:
        description: "Unattended continuation index"
        required: false
        default: "0"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: graphwar-official-autoplay
  cancel-in-progress: true

jobs:
  graphwar:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out runner source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install GUI/recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg

      - name: Download original Graphwar 1
        run: |
          curl -fL --retry 3 "https://www.graphwar.com/graphwar_1/graphwar.jar" -o graphwar.jar
          test -s graphwar.jar
          file graphwar.jar

      - name: Build my AutoAgent V2
        run: |
          set -euo pipefail
          test -s src/Graphwar/AutoAgent.java
          test -s src/Graphwar/AutoAgentV2.java
          sha256sum src/Graphwar/AutoAgent.java src/Graphwar/AutoAgentV2.java
          mkdir -p classes
          javac -cp graphwar.jar -d classes src/Graphwar/AutoAgent.java src/Graphwar/AutoAgentV2.java
          printf 'Premain-Class: Graphwar.AutoAgentV2\n' > MANIFEST.MF
          jar cfm autoagent.jar MANIFEST.MF -C classes .
          jar tf autoagent.jar | grep 'Graphwar/AutoAgent'

      - name: Run original Graphwar on official server
        shell: bash
        run: |
          set -uo pipefail
          export DISPLAY=:99

          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          XVPID=$!
          sleep 1

          ffmpeg -y \
            -f x11grab -framerate 8 -video_size 1280x800 -i :99 \
            -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p \
            graphwar-official-autoplay.mp4 >ffmpeg.log 2>&1 &
          FFPID=$!

          set +e
          timeout --signal=TERM --kill-after=10s 18120s \
            java -javaagent:autoagent.jar -jar graphwar.jar \
            >agent.log 2>&1
          JAVA_RC=$?
          set -e

          echo "java_exit=$JAVA_RC" | tee run-status.txt
          sleep 2

          ffmpeg -y \
            -f x11grab -video_size 1280x800 -i :99 \
            -frames:v 1 graphwar-final.png \
            >screenshot.log 2>&1 || true

          kill -INT "$FFPID" 2>/dev/null || true
          sleep 2
          kill "$XVPID" 2>/dev/null || true

          echo "===== agent.log tail ====="
          tail -n 400 agent.log || true

      - name: Report to control issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### [GPT-BOT] Graphwar unattended run finished'
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Chain: ${{ inputs.chain || '0' }}"
            echo
            echo '```text'
            tail -n 300 agent.log 2>/dev/null || echo "agent.log unavailable"
            echo '```'
          } > comment.md

          reported=0
          for delay in 0 3 8 15; do
            sleep "$delay"
            if jq -Rs '{body:.}' comment.md | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/1/comments" --input - >/dev/null 2>&1; then
              reported=1
              break
            fi
          done
          if [ "$reported" -ne 1 ]; then
            echo "::warning::GitHub issue API unavailable; artifact still contains agent.log"
          fi

      - name: Upload result and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphwar-official-autoplay-${{ github.run_number }}
          compression-level: 1
          path: |
            graphwar-official-autoplay.mp4
            graphwar-final.png
            agent.log
            run-status.txt
            xvfb.log
            ffmpeg.log
            screenshot.log
          if-no-files-found: warn

      - name: Continue unattended if no win
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        shell: bash
        run: |
          if grep -q 'WIN_REACHED' agent.log 2>/dev/null; then
            echo "Win reached; unattended chain stops here."
            exit 0
          fi

          if [ "$CHAIN" -ge 4 ]; then
            echo "No win after 5 unattended sessions; stopping to avoid an unbounded Actions loop."
            exit 0
          fi

          NEXT=$((CHAIN + 1))
          echo "No win yet; dispatching unattended continuation $NEXT/4"
          jq -nc --arg ref "$GITHUB_REF_NAME" --arg chain "$NEXT" \
            '{ref:$ref,inputs:{chain:$chain}}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/graphwar.yml/dispatches" --input -
