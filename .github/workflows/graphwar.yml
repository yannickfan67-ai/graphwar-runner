name: Graphwar Official Autoplay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/graphwar.yml"
      - "src/Graphwar/*.java"
  workflow_dispatch:
    inputs:
      chain:
        description: "Unattended continuation index"
        required: false
        default: "0"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: graphwar-official-autoplay
  cancel-in-progress: true

jobs:
  graphwar:
    name: graphwar-${{ matrix.instance }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        instance: [A, B]

    steps:
      - name: Check out runner source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install GUI/recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg

      - name: Download original Graphwar 1
        run: |
          curl -fL --retry 3 "https://www.graphwar.com/graphwar_1/graphwar.jar" -o graphwar.jar
          test -s graphwar.jar
          file graphwar.jar

      - name: Build my AutoAgent V2
        env:
          INSTANCE: ${{ matrix.instance }}
        run: |
          set -euo pipefail
          test -s src/Graphwar/AutoAgent.java
          test -s src/Graphwar/AutoAgentV2.java
          sed -i "s/static final String NAME=\"GPT\";/static final String NAME=\"GPT-${INSTANCE}\";/" src/Graphwar/AutoAgentV2.java
          grep 'static final String NAME' src/Graphwar/AutoAgentV2.java
          mkdir -p classes
          javac -cp graphwar.jar -d classes src/Graphwar/AutoAgent.java src/Graphwar/AutoAgentV2.java
          printf 'Premain-Class: Graphwar.AutoAgentV2\n' > MANIFEST.MF
          jar cfm autoagent.jar MANIFEST.MF -C classes .

      - name: Run and record official Graphwar
        shell: bash
        env:
          INSTANCE: ${{ matrix.instance }}
        run: |
          set -uo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >"xvfb-${INSTANCE}.log" 2>&1 &
          XVPID=$!
          sleep 1
          ffmpeg -y \
            -f x11grab -framerate 8 -video_size 1280x800 -i :99 \
            -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p \
            -f segment -segment_time 1800 -reset_timestamps 1 \
            "graphwar-${INSTANCE}-%03d.mp4" >"ffmpeg-${INSTANCE}.log" 2>&1 &
          FFPID=$!
          set +e
          timeout --signal=TERM --kill-after=10s 18120s \
            java -javaagent:autoagent.jar -jar graphwar.jar \
            >"agent-${INSTANCE}.log" 2>&1
          JAVA_RC=$?
          set -e
          echo "java_exit=$JAVA_RC" | tee "run-status-${INSTANCE}.txt"
          sleep 2
          ffmpeg -y \
            -f x11grab -video_size 1280x800 -i :99 \
            -frames:v 1 "graphwar-final-${INSTANCE}.png" \
            >"screenshot-${INSTANCE}.log" 2>&1 || true
          kill -INT "$FFPID" 2>/dev/null || true
          sleep 3
          kill "$XVPID" 2>/dev/null || true
          tail -n 400 "agent-${INSTANCE}.log" || true

      - name: Report to control issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTANCE: ${{ matrix.instance }}
        run: |
          {
            echo "### [GPT-${INSTANCE}] Graphwar unattended run finished"
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Instance: $INSTANCE"
            echo "- Chain: ${{ inputs.chain || '0' }}"
            echo
            echo '```text'
            tail -n 300 "agent-${INSTANCE}.log" 2>/dev/null || echo "agent log unavailable"
            echo '```'
          } > "comment-${INSTANCE}.md"
          for delay in 0 3 8 15; do
            sleep "$delay"
            jq -Rs '{body:.}' "comment-${INSTANCE}.md" | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/1/comments" --input - >/dev/null 2>&1 && break
          done

      - name: Upload recording and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphwar-video-${{ github.run_number }}-${{ matrix.instance }}
          compression-level: 1
          path: |
            graphwar-${{ matrix.instance }}-*.mp4
            graphwar-final-${{ matrix.instance }}.png
            agent-${{ matrix.instance }}.log
            run-status-${{ matrix.instance }}.txt
            xvfb-${{ matrix.instance }}.log
            ffmpeg-${{ matrix.instance }}.log
            screenshot-${{ matrix.instance }}.log
          if-no-files-found: warn

      - name: Upload lightweight status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphwar-status-${{ github.run_number }}-${{ matrix.instance }}
          compression-level: 9
          path: |
            agent-${{ matrix.instance }}.log
            run-status-${{ matrix.instance }}.txt
          if-no-files-found: warn

  continue:
    name: continue-unattended-chain
    needs: graphwar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download both status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: graphwar-status-${{ github.run_number }}-*
          path: statuses
      - name: Continue only if neither runner won
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        shell: bash
        run: |
          grep -R 'WIN_REACHED\|MATCH_RESULT\|SESSION_SUMMARY' statuses || true
          if grep -R -q 'WIN_REACHED' statuses 2>/dev/null; then
            echo "At least one runner won; unattended chain stops here."
            exit 0
          fi
          if [ "$CHAIN" -ge 4 ]; then
            echo "No win after 5 unattended dual-runner sessions; stopping."
            exit 0
          fi
          NEXT=$((CHAIN + 1))
          jq -nc --arg ref "$GITHUB_REF_NAME" --arg chain "$NEXT" \
            '{ref:$ref,inputs:{chain:$chain}}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/graphwar.yml/dispatches" --input -
