name: Stop Graphwar Official Autoplay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/graphwar.yml"
  workflow_dispatch:

concurrency:
  group: graphwar-official-autoplay
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Official Graphwar autoplay stopped"
